[package]
name = "steam-maintenance"
version = "0.2.0"
edition = "2021"
description = "User-driven NixOS upgrades for Steam machines running Jovian gaming mode"
license = "MIT"
repository = "https://github.com/OptimoSupreme/steam-maintenance"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
